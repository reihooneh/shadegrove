name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code and nothing else unless they say so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned packages and test browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Format and vet (Go, including the WebAssembly build)
        run: make lint
      - name: Engine and command line tests, with the race detector
        run: make test
      - name: Fuzz the scene parser briefly
        run: go test -run=NONE -fuzz=FuzzParseScene -fuzztime=20s ./engine
      - name: Build the WebAssembly engine
        run: make wasm
      - name: Check the committed site matches its sources
        run: |
          npm run build
          git diff --exit-code -- site
      - name: Browser tests at phone, tablet and desktop sizes
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - name: Build the WebAssembly engine
        run: make wasm
      - uses: actions/configure-pages@v5
      - name: Publish only the built site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
